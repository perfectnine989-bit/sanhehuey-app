name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -lh app/libs/libv2ray.aar

      - name: Apply minimal fixes
        run: |
          cat << 'SANHEHUEY_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SYSTEM_EXEMPTED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <!-- Нужно, чтобы на Android 11+ видеть список приложений для «Умного» режима -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.SanHeHuey"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- VPN для CDN-ключей (ядро Xray) -->
                  <service
                      android:name=".CdnVpnService"
                      android:exported="false"
                      android:foregroundServiceType="systemExempted"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          SANHEHUEY_EOF

          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/Store.kt
          package online.sanhehuey.app

          import android.content.Context
          import android.provider.Settings

          object Store {
              private const val PREF = "sanhehuey"
              private const val KEY_TOKEN = "token"

              fun token(ctx: Context): String =
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .getString(KEY_TOKEN, "") ?: ""

              fun saveToken(ctx: Context, token: String) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().putString(KEY_TOKEN, token).apply()
              }

              fun deviceId(ctx: Context): String {
                  val hw = runCatching {
                      Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ANDROID_ID)
                  }.getOrNull().orEmpty()
                  if (hw.isNotBlank() && hw != "9774d56d682e549c") return hw.take(32)
                  val p = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                  var id = p.getString("device", "") ?: ""
                  if (id.isBlank()) {
                      id = java.util.UUID.randomUUID().toString().replace("-", "").take(32)
                      p.edit().putString("device", id).apply()
                  }
                  return id
              }

              fun mode(ctx: Context): Mode =
                  if (ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("mode", "smart") == "global")
                      Mode.Global else Mode.Smart

              fun saveMode(ctx: Context, mode: Mode) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().putString("mode", if (mode == Mode.Global) "global" else "smart").apply()
              }

              /** Пакеты, которые в «Умном» режиме идут напрямую, мимо туннеля. */
              fun directApps(ctx: Context): Set<String> =
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .getStringSet("direct_apps", emptySet())?.toSet() ?: emptySet()

              fun saveDirectApps(ctx: Context, apps: Set<String>) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().putStringSet("direct_apps", apps.toSet()).apply()
              }

              /** Ключ, выбранный на этом устройстве (синхронизируется с сервером). */
              fun keyId(ctx: Context): String =
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("key_id", "") ?: ""

              fun saveKeyId(ctx: Context, id: String) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().putString("key_id", id).apply()
              }

              /** Лучшие адреса Cloudflare с прошлого подключения — проверяются первыми. */
              fun cdnNodes(ctx: Context): List<String> =
                  (ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("cdn_nodes", "") ?: "")
                      .split(",").filter { it.isNotBlank() }

              fun saveCdnNodes(ctx: Context, nodes: List<String>) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().putString("cdn_nodes", nodes.joinToString(",")).apply()
              }

              fun clearToken(ctx: Context) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().remove(KEY_TOKEN).remove("key_id").apply()
              }

              fun clear(ctx: Context) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                      .edit().clear().apply()
              }
          }
          SANHEHUEY_EOF

          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/Vpn.kt
          package online.sanhehuey.app

          import android.content.Context
          import androidx.core.content.ContextCompat
          import org.amnezia.awg.backend.GoBackend
          import org.amnezia.awg.backend.Tunnel
          import org.amnezia.awg.backend.TunnelActionHandler
          import org.amnezia.awg.config.Config
          import java.io.ByteArrayInputStream

          class AppTunnel(private val tunnelName: String) : Tunnel {
              var state: Tunnel.State = Tunnel.State.DOWN

              override fun getName(): String = tunnelName

              override fun onStateChange(newState: Tunnel.State) {
                  state = newState
              }

              override fun isIpv4ResolutionPreferred(): Boolean = true

              override fun isMetered(): Boolean = false
          }

          /** Скрипты до/после подключения нам не нужны — пустая реализация. */
          class NoopActions : TunnelActionHandler {
              override fun runPreUp(scripts: MutableCollection<String>) {}
              override fun runPostUp(scripts: MutableCollection<String>) {}
              override fun runPreDown(scripts: MutableCollection<String>) {}
              override fun runPostDown(scripts: MutableCollection<String>) {}
          }

          object Vpn {
              private var backend: GoBackend? = null
              private val tunnel = AppTunnel("sanhehuey")

              private fun backend(ctx: Context): GoBackend {
                  if (backend == null) {
                      backend = GoBackend(ctx.applicationContext, NoopActions())
                  }
                  return backend!!
              }

              fun isUp(ctx: Context): Boolean =
                  CdnVpnService.running ||
                  try {
                      backend(ctx).getState(tunnel) == Tunnel.State.UP
                  } catch (e: Exception) {
                      tunnel.state == Tunnel.State.UP
                  }

              fun connect(ctx: Context, configText: String) {
                  val cfg = Config.parse(
                      ByteArrayInputStream(configText.toByteArray())
                  )
                  backend(ctx).setState(tunnel, Tunnel.State.UP, cfg)
              }

              /** CDN-ключ (VLESS+WS через Cloudflare): ждём, пока сервис поднимет ядро, или отдаём ошибку. */
              fun connectCdn(ctx: Context, xrayConfig: String, smart: Boolean) {
                  CdnVpnService.lastError = null
                  ContextCompat.startForegroundService(
                      ctx,
                      android.content.Intent(ctx, CdnVpnService::class.java)
                          .putExtra(CdnVpnService.EXTRA_CONFIG, xrayConfig)
                          .putExtra(CdnVpnService.EXTRA_SMART, smart)
                  )
                  val end = System.currentTimeMillis() + 12_000L
                  while (System.currentTimeMillis() < end) {
                      if (CdnVpnService.running) return
                      CdnVpnService.lastError?.let { throw IllegalStateException(it) }
                      Thread.sleep(150)
                  }
                  CdnVpnService.stop()
                  throw IllegalStateException("VPN не запустился за 12 секунд")
              }

              fun disconnect(ctx: Context) {
                  if (CdnVpnService.running) CdnVpnService.stop()
                  runCatching { backend(ctx).setState(tunnel, Tunnel.State.DOWN, null) }
              }
          }
          SANHEHUEY_EOF

          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/CdnVpnService.kt
          package online.sanhehuey.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import libv2ray.CoreCallbackHandler
          import libv2ray.CoreController
          import libv2ray.Libv2ray

          class CdnVpnService : VpnService() {

              companion object {
                  const val EXTRA_CONFIG = "xray_config"
                  const val EXTRA_SMART = "smart"
                  private const val CHANNEL_ID = "sanhehuey_vpn"
                  private const val NOTIF_ID = 1001

                  @Volatile var running = false
                  @Volatile var lastError: String? = null
                  @Volatile private var instance: CdnVpnService? = null

                  fun stop() {
                      instance?.stopAll()
                  }
              }

              private var tun: ParcelFileDescriptor? = null
              private var controller: CoreController? = null

              private val handler = object : CoreCallbackHandler {
                  override fun startup(): Long = 0L
                  override fun shutdown(): Long = 0L
                  override fun onEmitStatus(code: Long, message: String?): Long = 0L
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val config = intent?.getStringExtra(EXTRA_CONFIG)
                  if (config.isNullOrBlank()) {
                      stopAll()
                      return START_NOT_STICKY
                  }
                  startForegroundCompat()
                  val smart = intent.getBooleanExtra(EXTRA_SMART, true)
                  instance = this
                  Thread { startCore(config, smart) }.start()
                  return START_NOT_STICKY
              }

              private fun startForegroundCompat() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                          val ch = NotificationChannel(
                              CHANNEL_ID,
                              "SanHeHuey VPN",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              setShowBadge(false)
                          }
                          nm.createNotificationChannel(ch)
                      }
                  }
                  val openApp = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val notif: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("SanHeHuey VPN")
                      .setContentText("Под защитой Триады")
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setOngoing(true)
                      .setContentIntent(openApp)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SYSTEM_EXEMPTED)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              private fun startCore(config: String, smart: Boolean) {
                  try {
                      lastError = null
                      runCatching { controller?.stopLoop() }
                      controller = null
                      runCatching { tun?.close() }
                      tun = null

                      val b = Builder()
                          .setSession("SanHeHuey")
                          .setMtu(1500)
                          .addAddress("172.19.0.1", 30)
                          .addDnsServer("1.1.1.1")
                          .addDnsServer("8.8.8.8")

                      if (smart) {
                          var added = 0
                          for (cidr in Routes.cidrs(this)) {
                              val ip = cidr.substringBefore("/")
                              val prefix = cidr.substringAfter("/", "").toIntOrNull() ?: continue
                              if (runCatching { b.addRoute(ip, prefix) }.isSuccess) added++
                          }
                          if (added == 0) b.addRoute("0.0.0.0", 0)
                      } else {
                          b.addRoute("0.0.0.0", 0)
                      }

                      runCatching { b.addDisallowedApplication(packageName) }
                      if (smart) {
                          for (pkg in Store.directApps(this)) runCatching { b.addDisallowedApplication(pkg) }
                      }

                      val pfd = b.establish() ?: throw IllegalStateException("Не удалось создать VPN-интерфейс")
                      tun = pfd

                      Libv2ray.initCoreEnv(filesDir.absolutePath, "")
                      val ctl = Libv2ray.newCoreController(handler)
                      ctl.startLoop(config, pfd.fd)
                      controller = ctl
                      running = true
                  } catch (e: Throwable) {
                      android.util.Log.e("SanHeHuey", "cdn start failed", e)
                      lastError = (e::class.java.simpleName + ": " + (e.message ?: "нет деталей")).take(300)
                      stopAll()
                  }
              }

              fun stopAll() {
                  runCatching { controller?.stopLoop() }
                  controller = null
                  runCatching { tun?.close() }
                  tun = null
                  running = false
                  if (instance === this) instance = null
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } else {
                      @Suppress("DEPRECATION")
                      stopForeground(true)
                  }
                  stopSelf()
              }

              override fun onRevoke() {
                  stopAll()
              }

              override fun onDestroy() {
                  runCatching { controller?.stopLoop() }
                  runCatching { tun?.close() }
                  running = false
                  if (instance === this) instance = null
                  super.onDestroy()
              }
          }
          SANHEHUEY_EOF

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x ./gradlew || true
          gradle wrapper --gradle-version 8.11.1 || true
          mkdir -p out
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/*.apk out/sanhehuey-client.apk

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*rror|error:|What went wrong" -A4 build.log | head -160 || true

      - uses: actions/upload-artifact@v4
        with:
          name: sanhehuey-apk
          path: out/sanhehuey-client.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
