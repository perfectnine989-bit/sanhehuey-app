          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/Api.kt
          package online.sanhehuey.app

          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          object Api {
              private const val BASE = "https://sanhehuey.online"
              private val JSON_MEDIA = "application/json; charset=utf-8".toMediaType()

              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(20, TimeUnit.SECONDS)
                  .writeTimeout(15, TimeUnit.SECONDS)
                  .callTimeout(25, TimeUnit.SECONDS)
                  .build()

              private fun executeJson(req: Request): JSONObject {
                  http.newCall(req).execute().use { r ->
                      val body = r.body?.string().orEmpty()
                      if (body.isBlank()) return JSONObject()
                      return JSONObject(body)
                  }
              }

              private fun get(path: String): JSONObject =
                  executeJson(Request.Builder().url(BASE + path).build())

              private fun post(path: String): JSONObject =
                  executeJson(Request.Builder().url(BASE + path).post("".toRequestBody()).build())

              private fun postJson(path: String, json: JSONObject): JSONObject =
                  executeJson(
                      Request.Builder()
                          .url(BASE + path)
                          .post(json.toString().toRequestBody(JSON_MEDIA))
                          .build()
                  )

              fun authStart(): JSONObject = post("/api/app/auth/start")

              fun authStatus(code: String, device: String): JSONObject =
                  get("/api/app/auth/status/${enc(code)}?device=${enc(device)}")

              fun logout(token: String): JSONObject =
                  postJson("/api/app/logout", JSONObject().put("token", token))

              fun state(token: String): JSONObject =
                  get("/api/app/state?token=${enc(token)}")

              fun renew(token: String): JSONObject =
                  postJson("/api/app/renew", JSONObject().put("token", token).put("plan", "1m"))

              fun config(token: String, device: String = "", keyId: String = ""): JSONObject {
                  var path = "/api/app/config?token=${enc(token)}"
                  if (device.isNotBlank()) path += "&device=" + enc(device)
                  if (keyId.isNotBlank()) path += "&key_id=" + enc(keyId)
                  return get(path)
              }

              fun keys(token: String, device: String): JSONObject =
                  get("/api/app/keys?token=${enc(token)}&device=${enc(device)}")

              fun selectKey(token: String, device: String, deviceName: String, keyId: String, force: Boolean): JSONObject {
                  val json = JSONObject()
                      .put("token", token)
                      .put("device", device)
                      .put("device_name", deviceName)
                      .put("key_id", keyId)
                      .put("force", force)
                  return postJson("/api/app/key/select", json)
              }

              private fun enc(v: String): String = URLEncoder.encode(v, "UTF-8")
          }
