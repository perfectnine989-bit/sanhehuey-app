name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -la app/libs

      - name: Build debug APK
        env:
          TEAM_API: ${{ secrets.TEAM_API }}
          TEAM_HOST: ${{ secrets.TEAM_HOST }}
          TEAM_SECRET: ${{ secrets.TEAM_SECRET }}
        run: |
          set -o pipefail
          chmod +x ./gradlew || true
          gradle wrapper --gradle-version 8.11.1 || true
          mkdir -p out
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/*.apk out/sanhehuey-client.apk
          # Сборка для команды (без входа, 8 устройств): только если заданы секреты репозитория
          if [ -n "$TEAM_SECRET" ] && [ -n "$TEAM_API" ]; then
            ./gradlew assembleDebug -Pteam=true "-PteamApi=$TEAM_API" "-PteamHost=$TEAM_HOST" "-PteamSecret=$TEAM_SECRET" --stacktrace 2>&1 | tee -a build.log
            cp app/build/outputs/apk/debug/*.apk out/sanhehuey-team.apk
          else
            echo "TEAM_* secrets not set: team APK skipped" | tee -a build.log
          fi

      - name: Show errors
        if: failure()
        run: |
          echo "--- assets of AndroidLibXrayLite latest release ---"
          curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep -E '"(tag_name|name)"' | head -20 || true
          grep -E "^e: |^w: .*rror|error:|What went wrong" -A4 build.log | head -160 || true

      - uses: actions/upload-artifact@v4
        with:
          name: sanhehuey-apk
          path: out/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
