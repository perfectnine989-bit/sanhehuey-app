          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/Cdn.kt
          package online.sanhehuey.app

          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.security.SecureRandom
          import javax.net.ssl.SNIHostName
          import javax.net.ssl.SSLSocket
          import javax.net.ssl.SSLSocketFactory

          object Cdn {
              data class Info(
                  val uuid: String,
                  val host: String,
                  val sni: String,
                  val port: Int,
                  val path: String,
                  val fp: String,
                  val nodes: List<String>
              )

              fun parse(o: JSONObject?): Info? {
                  if (o == null) return null
                  val uuid = o.optString("uuid")
                  val host = o.optString("host")
                  val path = o.optString("path")
                  if (uuid.isBlank() || host.isBlank() || path.isBlank()) return null
                  val nodes = mutableListOf<String>()
                  val arr: JSONArray? = o.optJSONArray("nodes")
                  if (arr != null) for (i in 0 until arr.length()) arr.optString(i).takeIf { it.isNotBlank() }?.let { nodes.add(it) }
                  if (host !in nodes) nodes.add(0, host)
                  return Info(
                      uuid = uuid,
                      host = host,
                      sni = o.optString("sni").ifBlank { host },
                      port = o.optInt("port", 443),
                      path = path,
                      fp = o.optString("fp").ifBlank { "chrome" },
                      nodes = nodes
                  )
              }

              private fun probe(info: Info, node: String): Int? = runCatching {
                  val started = System.nanoTime()
                  val raw = Socket()
                  var ssl: SSLSocket? = null
                  try {
                      raw.connect(InetSocketAddress(node, info.port), 2500)
                      raw.soTimeout = 2500
                      val factory = SSLSocketFactory.getDefault() as SSLSocketFactory
                      ssl = (factory.createSocket(raw, info.sni, info.port, true) as SSLSocket).apply {
                          val params = sslParameters
                          params.serverNames = listOf(SNIHostName(info.sni))
                          params.applicationProtocols = arrayOf("http/1.1")
                          sslParameters = params
                          startHandshake()
                      }
                      val keyBytes = ByteArray(16).also { SecureRandom().nextBytes(it) }
                      val key = Base64.encodeToString(keyBytes, Base64.NO_WRAP)
                      val req = "GET " + info.path + " HTTP/1.1\r\n" +
                          "Host: " + info.host + "\r\n" +
                          "Upgrade: websocket\r\nConnection: Upgrade\r\n" +
                          "Sec-WebSocket-Key: " + key + "\r\nSec-WebSocket-Version: 13\r\n\r\n"
                      ssl.outputStream.write(req.toByteArray())
                      ssl.outputStream.flush()
                      val line = BufferedReader(InputStreamReader(ssl.inputStream)).readLine().orEmpty()
                      if (line.contains(" 101")) ((System.nanoTime() - started) / 1_000_000L).toInt() else null
                  } finally {
                      runCatching { ssl?.close() }
                      runCatching { raw.close() }
                  }
              }.getOrNull()

              suspend fun rank(info: Info, preferred: List<String>): List<Pair<String, Int>> = coroutineScope {
                  val all = (preferred + info.nodes).distinct()
                  all.map { node -> async(Dispatchers.IO) { node to probe(info, node) } }
                      .awaitAll()
                      .mapNotNull { (node, ms) -> if (ms != null) node to ms else null }
                      .sortedBy { it.second }
              }

              fun xrayConfig(info: Info, node: String): String {
                  val tun = JSONObject()
                      .put("tag", "tun-in")
                      .put("protocol", "tun")
                      .put(
                          "settings",
                          JSONObject().put("name", "xray0").put("mtu", 1400).put("userLevel", 0)
                      )

                  val user = JSONObject().put("id", info.uuid).put("encryption", "none").put("level", 0)
                  val vnext = JSONObject()
                      .put("address", node)
                      .put("port", info.port)
                      .put("users", JSONArray().put(user))
                  val stream = JSONObject()
                      .put("network", "ws")
                      .put("security", "tls")
                      .put(
                          "tlsSettings",
                          JSONObject()
                              .put("serverName", info.sni)
                              .put("fingerprint", info.fp)
                              .put("alpn", JSONArray().put("http/1.1"))
                      )
                      .put(
                          "wsSettings",
                          JSONObject()
                              .put("path", info.path)
                              .put("host", info.host)
                              .put("headers", JSONObject().put("Host", info.host))
                      )
                  val proxy = JSONObject()
                      .put("tag", "proxy")
                      .put("protocol", "vless")
                      .put("settings", JSONObject().put("vnext", JSONArray().put(vnext)))
                      .put("streamSettings", stream)
                  val direct = JSONObject().put("tag", "direct").put("protocol", "freedom")

                  return JSONObject()
                      .put("log", JSONObject().put("loglevel", "warning"))
                      .put("inbounds", JSONArray().put(tun))
                      .put("outbounds", JSONArray().put(proxy).put(direct))
                      .toString()
              }
          }
          SANHEHUEY_EOF

          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/CdnVpnService.kt
          package online.sanhehuey.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import libv2ray.CoreCallbackHandler
          import libv2ray.CoreController
          import libv2ray.Libv2ray
          import java.util.concurrent.Executors

          class CdnVpnService : VpnService() {

              companion object {
                  const val EXTRA_CONFIG = "xray_config"
                  const val EXTRA_SMART = "smart"
                  const val EXTRA_NODE = "cdn_node"
                  private const val CHANNEL_ID = "sanhehuey_vpn"
                  private const val NOTIF_ID = 1001

                  @Volatile var running = false
                  @Volatile var lastError: String? = null
                  @Volatile var connectedAt: Long = 0L
                  @Volatile var activeNode: String? = null
                  @Volatile private var instance: CdnVpnService? = null

                  fun stop() {
                      instance?.stopAll()
                  }
              }

              private val executor = Executors.newSingleThreadExecutor()
              private var tun: ParcelFileDescriptor? = null
              private var controller: CoreController? = null

              private val handler = object : CoreCallbackHandler {
                  override fun startup(): Long = 0L
                  override fun shutdown(): Long = 0L
                  override fun onEmitStatus(code: Long, message: String?): Long = 0L
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val config = intent?.getStringExtra(EXTRA_CONFIG)
                  if (config.isNullOrBlank()) {
                      stopAll()
                      return START_NOT_STICKY
                  }

                  startForegroundCompat()

                  val smart = intent.getBooleanExtra(EXTRA_SMART, true)
                  val node = intent.getStringExtra(EXTRA_NODE)
                  instance = this
                  executor.execute { startCore(config, smart, node) }
                  return START_NOT_STICKY
              }

              private fun startForegroundCompat() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                          val ch = NotificationChannel(
                              CHANNEL_ID,
                              "SanHeHuey VPN",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Статус подключения VPN"
                              setShowBadge(false)
                          }
                          nm.createNotificationChannel(ch)
                      }
                  }

                  val openApp = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val notif: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("SanHeHuey VPN")
                      .setContentText("Под защитой Триады")
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setOngoing(true)
                      .setContentIntent(openApp)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SYSTEM_EXEMPTED)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              private fun startCore(config: String, smart: Boolean, node: String?) {
                  try {
                      closeCoreOnly()
                      lastError = null

                      val b = Builder()
                          .setSession("SanHeHuey")
                          .setMtu(1400)
                          .addAddress("172.19.0.1", 30)
                          .addDnsServer("1.1.1.1")
                          .addDnsServer("8.8.8.8")

                      if (smart) {
                          var added = 0
                          for (cidr in Routes.cidrs(this)) {
                              val ip = cidr.substringBefore("/")
                              val prefix = cidr.substringAfter("/", "").toIntOrNull() ?: continue
                              if (runCatching { b.addRoute(ip, prefix) }.isSuccess) added++
                          }
                          if (added == 0) b.addRoute("0.0.0.0", 0)
                      } else {
                          b.addRoute("0.0.0.0", 0)
                      }

                      runCatching { b.addDisallowedApplication(packageName) }
                      if (smart) {
                          for (pkg in Store.directApps(this)) runCatching { b.addDisallowedApplication(pkg) }
                      }

                      val pfd = b.establish() ?: throw IllegalStateException("Не удалось создать VPN-интерфейс")
                      tun = pfd

                      Libv2ray.initCoreEnv(filesDir.absolutePath, "")
                      val ctl = Libv2ray.newCoreController(handler)
                      ctl.startLoop(config, pfd.fd)
                      controller = ctl
                      activeNode = node?.takeIf { it.isNotBlank() }
                      connectedAt = System.currentTimeMillis()
                      running = true
                  } catch (e: Throwable) {
                      android.util.Log.e("SanHeHuey", "cdn start failed", e)
                      lastError = (e::class.java.simpleName + ": " + (e.message ?: "нет деталей")).take(300)
                      stopAll()
                  }
              }

              private fun closeCoreOnly() {
                  runCatching { controller?.stopLoop() }
                  controller = null
                  runCatching { tun?.close() }
                  tun = null
                  running = false
                  connectedAt = 0L
                  activeNode = null
              }

              fun stopAll() {
                  closeCoreOnly()
                  if (instance === this) instance = null
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } else {
                      @Suppress("DEPRECATION")
                      stopForeground(true)
                  }
                  stopSelf()
              }

              override fun onRevoke() {
                  stopAll()
              }

              override fun onDestroy() {
                  closeCoreOnly()
                  executor.shutdownNow()
                  if (instance === this) instance = null
                  super.onDestroy()
              }
          }
          SANHEHUEY_EOF

          cat << 'SANHEHUEY_EOF' > app/src/main/java/online/sanhehuey/app/Vpn.kt
          package online.sanhehuey.app

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import org.amnezia.awg.backend.GoBackend
          import org.amnezia.awg.backend.Tunnel
          import org.amnezia.awg.backend.TunnelActionHandler
          import org.amnezia.awg.config.Config
          import java.io.ByteArrayInputStream

          class AppTunnel(private val tunnelName: String) : Tunnel {
              var state: Tunnel.State = Tunnel.State.DOWN

              override fun getName(): String = tunnelName

              override fun onStateChange(newState: Tunnel.State) {
                  state = newState
              }

              override fun isIpv4ResolutionPreferred(): Boolean = true

              override fun isMetered(): Boolean = false
          }

          class NoopActions : TunnelActionHandler {
              override fun runPreUp(scripts: MutableCollection<String>) {}
              override fun runPostUp(scripts: MutableCollection<String>) {}
              override fun runPreDown(scripts: MutableCollection<String>) {}
              override fun runPostDown(scripts: MutableCollection<String>) {}
          }

          object Vpn {
              private var backend: GoBackend? = null
              private val tunnel = AppTunnel("sanhehuey")

              private fun backend(ctx: Context): GoBackend {
                  if (backend == null) {
                      backend = GoBackend(ctx.applicationContext, NoopActions())
                  }
                  return backend!!
              }

              fun isUp(ctx: Context): Boolean =
                  CdnVpnService.running ||
                  try {
                      backend(ctx).getState(tunnel) == Tunnel.State.UP
                  } catch (e: Exception) {
                      tunnel.state == Tunnel.State.UP
                  }

              fun connect(ctx: Context, configText: String) {
                  val cfg = Config.parse(
                      ByteArrayInputStream(configText.toByteArray())
                  )
                  backend(ctx).setState(tunnel, Tunnel.State.UP, cfg)
              }

              fun connectCdn(ctx: Context, xrayConfig: String, smart: Boolean, node: String = "") {
                  CdnVpnService.lastError = null
                  ContextCompat.startForegroundService(
                      ctx,
                      Intent(ctx, CdnVpnService::class.java)
                          .putExtra(CdnVpnService.EXTRA_CONFIG, xrayConfig)
                          .putExtra(CdnVpnService.EXTRA_SMART, smart)
                          .putExtra(CdnVpnService.EXTRA_NODE, node)
                  )
                  val end = System.currentTimeMillis() + 12_000L
                  while (System.currentTimeMillis() < end) {
                      if (CdnVpnService.running) return
                      CdnVpnService.lastError?.let { throw IllegalStateException(it) }
                      Thread.sleep(150)
                  }
                  CdnVpnService.stop()
                  throw IllegalStateException("VPN не запустился за 12 секунд")
              }

              fun disconnect(ctx: Context) {
                  if (CdnVpnService.running) CdnVpnService.stop()
                  runCatching { backend(ctx).setState(tunnel, Tunnel.State.DOWN, null) }
              }
          }
